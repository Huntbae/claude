# NVIDIA GPU 오버레이. 호스트에 NVIDIA Container Toolkit 이 설치되어 있어야 한다.
#   docker compose -f docker-compose.kr.yml -f docker-compose.nvidia.yml up -d
services:
  voicebox:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
